name: Health
on:
  schedule:
    - cron: '17 2 1 * *'   # monthly, 1st day 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/health.js', 'core.js', '.github/workflows/health.yml']
permissions:
  contents: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/health.js > /tmp/health.json && cat /tmp/health.json
      - name: Publish to branch "health"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan health-publish
          git rm -rf --cached . -q
          cp /tmp/health.json health.json
          git add health.json
          git commit -m "health $(date -u +%F)"
          git push -f origin HEAD:health
